<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vincent's Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container"></div>

  <div id="hud" class="pixel-ui">
    <span><span class="kbd">A</span> Left</span>
    <span><span class="kbd">D</span> Right</span>
    <span><span class="kbd">W</span> Jump</span>
    <span><span class="kbd">E</span> Interact</span>
    <span><span class="kbd">Q</span> Close</span>
  </div>

  <div id="weather-badge" class="pixel-ui">Weather: Loading...</div>
  <div id="loading-badge" class="pixel-ui">Loading world...</div>
  <div id="interaction-hint" class="pixel-ui">Press E to interact</div>

  <div id="modal-overlay">
    <div id="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Info</h2>
        <button class="modal-close" id="close-modal">Close Q</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="rotate-overlay">
    <div class="rotate-box pixel-ui">
      <h2>Best in Landscape</h2>
      <p>Please rotate your phone for the best experience.</p>
      <p class="rotate-small">Desktop controls stay unchanged.</p>
    </div>
  </div>

  <div id="mobile-controls">
    <div class="mobile-left">
      <button class="mobile-btn" id="btn-left">◀</button>
      <button class="mobile-btn" id="btn-right">▶</button>
    </div>

    <div class="mobile-right">
      <button class="mobile-btn" id="btn-jump">▲</button>
      <button class="mobile-btn" id="btn-interact">E</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="main.js"></script>


  
</body>
</html>
