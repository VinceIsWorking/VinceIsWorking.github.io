<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vincent Liiiii | Retro Portfolio World</title>
  <style>
    :root {
      --panel: rgba(15, 23, 42, 0.92);
      --accent: #facc15;
      --accent-2: #38bdf8;
      --text: #f8fafc;
      --muted: #cbd5e1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #7dd3fc 0%, #bae6fd 45%, #d9f99d 100%);
      font-family: "Courier New", monospace;
      color: var(--text);
    }

    #game-container {
      width: 100vw;
      height: 100vh;
    }

    .pixel-ui {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
      image-rendering: pixelated;
      border: 4px solid #0f172a;
      box-shadow: 0 0 0 4px #ffffff, 0 8px 0 rgba(15, 23, 42, 0.5);
    }

    #hud {
      top: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(255, 255, 255, 0.88);
      color: #0f172a;
      padding: 10px 14px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      max-width: calc(100vw - 24px);
      flex-wrap: wrap;
      justify-content: center;
    }

    #interaction-hint {
      bottom: 28px;
      display: none;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 12px 18px;
      font-size: 15px;
    }

    #weather-badge {
      top: 84px;
      background: rgba(15, 23, 42, 0.88);
      color: #fff;
      padding: 8px 12px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #loading-badge {
      top: 132px;
      background: rgba(255, 255, 255, 0.92);
      color: #0f172a;
      padding: 8px 12px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(2, 6, 23, 0.6);
      z-index: 30;
    }

    #modal {
      width: min(860px, 100%);
      max-height: min(82vh, 920px);
      overflow: auto;
      background: var(--panel);
      border: 4px solid #0f172a;
      box-shadow: 0 0 0 4px #fff, 0 12px 0 rgba(15, 23, 42, 0.6);
      padding: 0;
      image-rendering: pixelated;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 4px solid rgba(255, 255, 255, 0.15);
      background: linear-gradient(90deg, rgba(250, 204, 21, 0.2), rgba(56, 189, 248, 0.18));
    }

    .modal-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      color: var(--accent);
      text-transform: uppercase;
    }

    .modal-close {
      border: 3px solid #fff;
      background: #ef4444;
      color: #fff;
      font: inherit;
      font-size: 14px;
      padding: 8px 12px;
      cursor: pointer;
      pointer-events: auto;
      text-transform: uppercase;
    }

    .modal-body {
      padding: 20px;
      color: var(--text);
      line-height: 1.7;
      font-size: 16px;
    }

    .modal-body h3 {
      margin-top: 0;
      color: var(--accent-2);
      text-transform: uppercase;
      font-size: 18px;
    }

    .modal-body p,
    .modal-body li { color: var(--muted); }

    .modal-body ul { padding-left: 20px; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .pixel-card {
      border: 3px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.05);
      padding: 14px;
    }

    .pixel-card strong {
      display: block;
      color: #fff;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .modal-body a {
      color: #fde68a;
      word-break: break-word;
    }

    .kbd {
      display: inline-block;
      min-width: 28px;
      padding: 3px 6px;
      text-align: center;
      border: 2px solid #0f172a;
      background: #fff;
      color: #0f172a;
      box-shadow: 0 2px 0 #0f172a;
      font-weight: 700;
    }

    @media (max-width: 700px) {
      #hud {
        font-size: 12px;
        padding: 8px 10px;
        gap: 8px;
      }

      #weather-badge { top: 96px; font-size: 11px; }
      #loading-badge { top: 138px; font-size: 10px; }
      .modal-title { font-size: 18px; }
      .modal-body { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="hud" class="pixel-ui">
    <span><span class="kbd">A</span> Left</span>
    <span><span class="kbd">D</span> Right</span>
    <span><span class="kbd">W</span> Jump</span>
    <span><span class="kbd">E</span> Interact</span>
    <span><span class="kbd">Q</span> Close</span>
  </div>

  <div id="weather-badge" class="pixel-ui">Weather: Loading...</div>
  <div id="loading-badge" class="pixel-ui">Loading world...</div>
  <div id="interaction-hint" class="pixel-ui">Press E to interact</div>

  <div id="modal-overlay">
    <div id="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Info</h2>
        <button class="modal-close" id="close-modal">Close Q</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script>
    const PLATFORM_WIDTH = 53;

    const portfolioContent = {
      about: {
        title: 'About Me',
        body: `
          <h3>Hello, I'm Vincent</h3>
          <p>I build interactive software experiences with a strong focus on Unreal Engine, real-time visualization, tools, and creative technical problem solving.</p>
          <p>This portfolio is designed like a side-scrolling game so visitors can explore my work instead of clicking through a traditional menu.</p>
          <div class="card-grid">
            <div class="pixel-card"><strong>Base</strong> Melbourne, Australia</div>
            <div class="pixel-card"><strong>Background</strong> Software / interactive development</div>
            <div class="pixel-card"><strong>Style</strong> Technical + creative + product-minded</div>
          </div>
        `
      },
      projects: {
        title: 'Projects',
        body: `
          <h3>Featured Work</h3>
          <div class="card-grid">
            <div class="pixel-card"><strong>Aspectu</strong> UE5 standalone application for construction-stage simulation, model import, XML scheduling, timeline playback, and video export.</div>
            <div class="pixel-card"><strong>ModelTree</strong> TreeView-driven model structure and runtime data handling system for large imported scene hierarchies.</div>
            <div class="pixel-card"><strong>ProjectK</strong> Dance learning / motion comparison concept using reference video + user video analysis.</div>
          </div>
          <p style="margin-top:16px;">Add your real links here:</p>
          <ul>
            <li>GitHub: <a href="https://github.com/vincelsworking" target="_blank" rel="noopener noreferrer">github.com/vincelsworking</a></li>
            <li>Demo / case study links can be added per project</li>
          </ul>
        `
      },
      contact: {
        title: 'Contact',
        body: `
          <h3>Let's Connect</h3>
          <ul>
            <li>Email: <a href="mailto:your-email@example.com">your-email@example.com</a></li>
            <li>LinkedIn: <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">Add your LinkedIn URL</a></li>
            <li>GitHub: <a href="https://github.com/vincelsworking" target="_blank" rel="noopener noreferrer">github.com/vincelsworking</a></li>
          </ul>
        `
      },
      resume: {
        title: 'Resume',
        body: `
          <h3>Download Resume</h3>
          <p>Add your PDF to the repository, for example:</p>
          <ul>
            <li><code>/assets/Vincent_Li_Resume.pdf</code></li>
          </ul>
          <p>Then update this link:</p>
          <p><a href="./assets/Vincent_Li_Resume.pdf" target="_blank" rel="noopener noreferrer">Open Resume PDF</a></p>
        `
      }
    };

    const modalOverlay = document.getElementById('modal-overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const closeModalButton = document.getElementById('close-modal');
    const interactionHint = document.getElementById('interaction-hint');
    const weatherBadge = document.getElementById('weather-badge');
    const loadingBadge = document.getElementById('loading-badge');

    let activeInteractable = null;
    let isModalOpen = false;
    let currentWeatherTheme = 'cloudy';
    let game = null;

    function openModal(key) {
      const item = portfolioContent[key];
      if (!item) return;
      modalTitle.textContent = item.title;
      modalBody.innerHTML = item.body;
      modalOverlay.style.display = 'flex';
      isModalOpen = true;
    }

    function closeModal() {
      modalOverlay.style.display = 'none';
      isModalOpen = false;
    }

    function normalizeWeatherTheme(text) {
      const value = String(text || '').toLowerCase();
      if (value.includes('snow') || value.includes('sleet') || value.includes('blizzard') || value.includes('ice')) return 'snow';
      if (value.includes('rain') || value.includes('shower') || value.includes('drizzle') || value.includes('storm')) return 'rain';
      if (value.includes('sun') || value.includes('clear') || value.includes('fair')) return 'sunny';
      return 'cloudy';
    }

    async function fetchMelbourneWeatherTheme() {
      try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-37.8136&longitude=144.9631&current=weather_code,is_day&timezone=Australia%2FMelbourne');
        const data = await response.json();
        const code = data?.current?.weather_code;
        const codeMap = {
          0: 'sunny', 1: 'sunny', 2: 'cloudy', 3: 'cloudy', 45: 'cloudy', 48: 'cloudy',
          51: 'rain', 53: 'rain', 55: 'rain', 56: 'rain', 57: 'rain', 61: 'rain', 63: 'rain', 65: 'rain', 66: 'rain', 67: 'rain',
          71: 'snow', 73: 'snow', 75: 'snow', 77: 'snow', 80: 'rain', 81: 'rain', 82: 'rain', 85: 'snow', 86: 'snow',
          95: 'rain', 96: 'snow', 99: 'snow'
        };
        currentWeatherTheme = codeMap[code] || 'cloudy';
      } catch (error) {
        currentWeatherTheme = normalizeWeatherTheme('partly sunny');
      }
      weatherBadge.textContent = `Weather: ${currentWeatherTheme}`;
      return currentWeatherTheme;
    }

    closeModalButton.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    class PortfolioScene extends Phaser.Scene {
      constructor() {
        super('PortfolioScene');
      }

      preload() {
        this.createTextures();
      }

      create() {
        this.worldWidth = window.innerWidth;
        this.worldHeight = window.innerHeight;

        this.physics.world.setBounds(0, 0, this.worldWidth, this.worldHeight);
        this.cameras.main.setBounds(0, 0, this.worldWidth, this.worldHeight);
        this.cameras.main.roundPixels = true;

        this.layout = this.buildResponsiveLayout();

        this.drawBackground();
        this.createPlatforms();
        this.createDecorations();
        this.createInteractables();
        this.createPlayer();
        this.createControls();
        this.createOverlapZones();
        this.createSigns();
      }

      createTextures() {
        const g = this.add.graphics();

        if (!this.textures.exists('ground')) {
          g.clear();
          g.fillStyle(0x22c55e, 1);
          g.fillRect(0, 0, 64, 24);
          g.fillStyle(0x166534, 1);
          for (let x = 0; x < 64; x += 8) g.fillRect(x, 16, 8, 8);
          g.generateTexture('ground', 64, 24);
        }

        if (!this.textures.exists('platform')) {
          g.clear();
          g.fillStyle(0xf59e0b, 1);
          g.fillRect(0, 0, PLATFORM_WIDTH, 16);
          g.fillStyle(0x92400e, 1);
          g.fillRect(0, 12, PLATFORM_WIDTH, 4);
          g.generateTexture('platform', PLATFORM_WIDTH, 16);
        }

        const playerVariants = [
          { key: 'player_red', body: 0xdc2626, head: 0xfde68a, leg: 0x1f2937 },
          { key: 'player_blue', body: 0x2563eb, head: 0xfbbf24, leg: 0x1e293b },
          { key: 'player_green', body: 0x16a34a, head: 0xfcd34d, leg: 0x334155 },
          { key: 'player_purple', body: 0x7c3aed, head: 0xfde68a, leg: 0x111827 }
        ];

        playerVariants.forEach(variant => {
          if (this.textures.exists(variant.key)) return;
          g.clear();
          g.fillStyle(variant.body, 1);
          g.fillRect(10, 8, 20, 24);
          g.fillStyle(variant.head, 1);
          g.fillRect(14, 0, 12, 12);
          g.fillStyle(variant.leg, 1);
          g.fillRect(8, 30, 10, 6);
          g.fillRect(22, 30, 10, 6);
          g.generateTexture(variant.key, 40, 36);
        });

        if (!this.textures.exists('profile')) {
          g.clear();
          g.fillStyle(0x0f172a, 1);
          g.fillCircle(32, 18, 12);
          g.fillStyle(0x60a5fa, 1);
          g.fillRoundedRect(14, 32, 36, 20, 6);
          g.generateTexture('profile', 64, 64);
        }

        if (!this.textures.exists('computer')) {
          g.clear();
          g.fillStyle(0x475569, 1);
          g.fillRect(10, 8, 44, 34);
          g.fillStyle(0x0f172a, 1);
          g.fillRect(14, 12, 36, 22);
          g.fillStyle(0x64748b, 1);
          g.fillRect(0, 42, 64, 14);
          g.generateTexture('computer', 64, 56);
        }

        if (!this.textures.exists('mail')) {
          g.clear();
          g.fillStyle(0x94a3b8, 1);
          g.fillRect(8, 16, 48, 32);
          g.fillStyle(0xf8fafc, 1);
          g.fillRect(10, 18, 44, 28);
          g.fillStyle(0x1d4ed8, 1);
          g.fillTriangle(10, 18, 32, 34, 54, 18);
          g.fillStyle(0x93c5fd, 1);
          g.fillTriangle(10, 46, 24, 32, 32, 38);
          g.fillTriangle(54, 46, 40, 32, 32, 38);
          g.generateTexture('mail', 64, 64);
        }

        if (!this.textures.exists('resume_icon')) {
          g.clear();
          g.fillStyle(0x94a3b8, 1);
          g.fillRect(14, 6, 36, 50);
          g.fillStyle(0xf8fafc, 1);
          g.fillRect(16, 8, 32, 46);
          g.fillStyle(0xe2e8f0, 1);
          g.fillRect(42, 8, 6, 10);
          g.fillStyle(0x2563eb, 1);
          g.fillRect(22, 18, 20, 3);
          g.fillRect(22, 26, 20, 3);
          g.fillRect(22, 34, 16, 3);
          g.fillRect(22, 42, 18, 3);
          g.generateTexture('resume_icon', 64, 64);
        }

        if (!this.textures.exists('cloud')) {
          g.clear();
          g.fillStyle(0xffffff, 0.95);
          g.fillRect(0, 0, 64, 32);
          g.fillStyle(0xdbeafe, 1);
          g.fillRect(6, 6, 52, 20);
          g.generateTexture('cloud', 64, 32);
        }

        if (!this.textures.exists('raindrop')) {
          g.clear();
          g.fillStyle(0x60a5fa, 1);
          g.fillRect(2, 0, 2, 8);
          g.generateTexture('raindrop', 4, 8);
        }

        if (!this.textures.exists('snowflake')) {
          g.clear();
          g.fillStyle(0xffffff, 1);
          g.fillRect(2, 0, 2, 6);
          g.fillRect(0, 2, 6, 2);
          g.generateTexture('snowflake', 6, 6);
        }

        g.destroy();
      }

      buildResponsiveLayout() {
        const groundY = this.worldHeight - 78;
        const centerX = this.worldWidth / 2;

        const gapX = Phaser.Math.Clamp(this.worldWidth * 0.14, 120, 260);
        const gapY = Phaser.Math.Clamp(this.worldHeight * 0.085, 42, 82);
        const baseY = Math.min(this.worldHeight - 165, this.worldHeight * 0.72);

        const level1Y = baseY;
        const level2Y = baseY - gapY;
        const level3Y = baseY - gapY * 2;
        const level4Y = baseY - gapY * 3;

        const points = {
          about: centerX - gapX / 2,
          projects: centerX + gapX / 2,
          resume: centerX - gapX / 2,
          contact: centerX + gapX / 2
        };

        return { groundY, level1Y, level2Y, level3Y, level4Y, points, gapX, gapY };
      }

      drawBackground() {
        const themeStyles = {
          sunny: { top: 0x38bdf8, bottom: 0xfef08a, hill: 0x4ade80, cloudAlpha: 0.65 },
          cloudy: { top: 0x94a3b8, bottom: 0xcbd5e1, hill: 0x65a30d, cloudAlpha: 0.95 },
          rain: { top: 0x475569, bottom: 0x94a3b8, hill: 0x3f6212, cloudAlpha: 1 },
          snow: { top: 0xbfe3ff, bottom: 0xe0f2fe, hill: 0xe2e8f0, cloudAlpha: 0.95 }
        };

        const style = themeStyles[currentWeatherTheme] || themeStyles.cloudy;
        this.cameras.main.setBackgroundColor(style.top);

        this.add.rectangle(this.worldWidth / 2, this.worldHeight * 0.25, this.worldWidth, this.worldHeight * 0.5, style.top).setScrollFactor(0);
        this.add.rectangle(this.worldWidth / 2, this.worldHeight * 0.75, this.worldWidth, this.worldHeight * 0.5, style.bottom).setScrollFactor(0);

        if (currentWeatherTheme === 'sunny') {
          this.add.circle(this.worldWidth * 0.12, this.worldHeight * 0.14, 42, 0xfacc15).setScrollFactor(0);
        }

        const cloudCount = currentWeatherTheme === 'sunny' ? 4 : 7;
        for (let i = 0; i < cloudCount; i++) {
          this.add.image(80 + i * (this.worldWidth / cloudCount), 70 + (i % 3) * 28, 'cloud').setAlpha(style.cloudAlpha).setScrollFactor(0);
        }

        const hillCount = Math.max(4, Math.floor(this.worldWidth / 160));
        for (let i = 0; i < hillCount; i++) {
          const hill = this.add.ellipse(i * (this.worldWidth / hillCount) + 80, this.worldHeight - 60, 220, 120, style.hill);
          hill.setOrigin(0.5, 1);
          hill.setScrollFactor(0);
        }

        if (currentWeatherTheme === 'rain') {
          for (let i = 0; i < 120; i++) {
            const drop = this.add.image(Phaser.Math.Between(0, this.worldWidth), Phaser.Math.Between(0, this.worldHeight - 120), 'raindrop');
            drop.setAlpha(0.75);
          }
        }

        if (currentWeatherTheme === 'snow') {
          for (let i = 0; i < 70; i++) {
            const flake = this.add.image(Phaser.Math.Between(0, this.worldWidth), Phaser.Math.Between(0, this.worldHeight - 120), 'snowflake');
            flake.setAlpha(0.85);
          }
        }
      }

      createPlatforms() {
        this.platforms = this.physics.add.staticGroup();

        for (let x = 0; x < this.worldWidth; x += 64) {
          const ground = this.platforms.create(x, this.layout.groundY, 'ground').setOrigin(0, 0);
          ground.refreshBody();
        }

        const centeredPlatform = (centerX, y, count = 2) => {
          const startX = centerX - (count * PLATFORM_WIDTH) / 2;
          for (let i = 0; i < count; i++) {
            const platform = this.platforms.create(startX + i * PLATFORM_WIDTH, y, 'platform').setOrigin(0, 0);
            platform.refreshBody();
          }
        };

        centeredPlatform(this.layout.points.about, this.layout.level1Y, 2);
        centeredPlatform(this.layout.points.projects, this.layout.level2Y, 2);
        centeredPlatform(this.layout.points.resume, this.layout.level3Y, 2);
        centeredPlatform(this.layout.points.contact, this.layout.level4Y, 2);
      }

      createDecorations() {
        const deco = [
          { x: this.worldWidth * 0.10, y: this.layout.groundY - 8, color: 0x16a34a },
          { x: this.worldWidth * 0.18, y: this.layout.groundY - 8, color: 0x15803d },
          { x: this.worldWidth * 0.82, y: this.layout.groundY - 8, color: 0x16a34a },
          { x: this.worldWidth * 0.90, y: this.layout.groundY - 8, color: 0x166534 }
        ];

        deco.forEach(({ x, y, color }) => {
          this.add.rectangle(x, y, 28, 70, 0x92400e).setOrigin(0.5, 1);
          this.add.circle(x, y - 56, 34, color).setOrigin(0.5, 1);
        });
      }

      createInteractables() {
        this.interactables = [
          { x: this.layout.points.about, y: this.layout.level1Y, key: 'about', sprite: 'profile', label: 'ABOUT ME' },
          { x: this.layout.points.projects, y: this.layout.level2Y, key: 'projects', sprite: 'computer', label: 'PROJECTS' },
          { x: this.layout.points.resume, y: this.layout.level3Y, key: 'resume', sprite: 'resume_icon', label: 'RESUME' },
          { x: this.layout.points.contact, y: this.layout.level4Y, key: 'contact', sprite: 'mail', label: 'CONTACT' }
        ];

        this.interactables.forEach(item => {
          item.gameObject = this.add.image(item.x, item.y, item.sprite).setOrigin(0.5, 1);
          item.zone = this.add.zone(item.x, item.y - 24, 110, 110);
          this.physics.world.enable(item.zone);
          item.zone.body.setAllowGravity(false);
          item.zone.body.moves = false;
        });
      }

      createSigns() {
        this.interactables.forEach(item => {
          this.add.text(item.x, item.y - 84, item.label, {
            fontFamily: 'Courier New, monospace',
            fontSize: '16px',
            color: '#0f172a',
            backgroundColor: '#ffffff',
            padding: { left: 6, right: 6, top: 4, bottom: 4 }
          }).setOrigin(0.5, 1);
        });
      }

      createPlayer() {
        const variants = ['player_red', 'player_blue', 'player_green', 'player_purple'];
        const randomVariant = Phaser.Utils.Array.GetRandom(variants);

        this.player = this.physics.add.sprite(Math.max(70, this.worldWidth * 0.08), this.layout.groundY - 130, randomVariant);
        this.player.setCollideWorldBounds(true);
        this.player.setBounce(0);
        this.player.setSize(18, 34).setOffset(11, 2);
        this.player.body.setGravityY(Phaser.Math.Clamp(this.worldHeight * 2.0, 1500, 2200));
        this.physics.add.collider(this.player, this.platforms);
      }

      createControls() {
        this.keys = this.input.keyboard.addKeys({
          left: Phaser.Input.Keyboard.KeyCodes.A,
          right: Phaser.Input.Keyboard.KeyCodes.D,
          up: Phaser.Input.Keyboard.KeyCodes.W,
          down: Phaser.Input.Keyboard.KeyCodes.S,
          interact: Phaser.Input.Keyboard.KeyCodes.E,
          close: Phaser.Input.Keyboard.KeyCodes.Q
        });
      }

      createOverlapZones() {
        this.interactables.forEach(item => {
          this.physics.add.overlap(this.player, item.zone, () => {
            activeInteractable = item;
          });
        });
      }

      update() {
        if (Phaser.Input.Keyboard.JustDown(this.keys.close) && isModalOpen) {
          closeModal();
        }

        if (isModalOpen) {
          this.player.setVelocityX(0);
          interactionHint.style.display = 'none';
          return;
        }

        let touching = null;
        for (const item of this.interactables) {
          const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, item.x, item.y - 20);
          if (dist < 95) {
            touching = item;
            break;
          }
        }
        activeInteractable = touching;

        const speed = Phaser.Math.Clamp(this.worldWidth * 0.16, 210, 360);

        if (this.keys.left.isDown) {
          this.player.setVelocityX(-speed);
          this.player.setFlipX(true);
        } else if (this.keys.right.isDown) {
          this.player.setVelocityX(speed);
          this.player.setFlipX(false);
        } else {
          this.player.setVelocityX(0);
        }

        if (Phaser.Input.Keyboard.JustDown(this.keys.up) && this.player.body.blocked.down) {
          const jumpVelocity = -Phaser.Math.Clamp(this.layout.gapY * 9.6, 700, 980);
          this.player.setVelocityY(jumpVelocity);
        }

        if (this.keys.down.isDown && this.player.body.blocked.down) {
          this.player.setScale(1, 0.85);
        } else {
          this.player.setScale(1, 1);
        }

        if (activeInteractable) {
          interactionHint.style.display = 'block';
          interactionHint.textContent = `Press E to interact: ${activeInteractable.label}`;
          if (Phaser.Input.Keyboard.JustDown(this.keys.interact)) {
            openModal(activeInteractable.key);
          }
        } else {
          interactionHint.style.display = 'none';
        }
      }
    }

    async function bootstrapGame() {
      loadingBadge.textContent = 'Loading weather...';
      await fetchMelbourneWeatherTheme();
      loadingBadge.textContent = 'Loading world...';

      const config = {
        type: Phaser.AUTO,
        parent: 'game-container',
        width: window.innerWidth,
        height: window.innerHeight,
        backgroundColor: '#7dd3fc',
        pixelArt: true,
        scale: {
          mode: Phaser.Scale.RESIZE,
          autoCenter: Phaser.Scale.CENTER_BOTH
        },
        physics: {
          default: 'arcade',
          arcade: {
            gravity: { y: 0 },
            debug: false
          }
        },
        scene: [PortfolioScene]
      };

      game = new Phaser.Game(config);
      loadingBadge.style.display = 'none';
    }

    window.addEventListener('resize', () => {
      if (!game) return;
      game.scale.resize(window.innerWidth, window.innerHeight);
      game.scene.stop('PortfolioScene');
      game.scene.start('PortfolioScene');
    });

    bootstrapGame();
  </script>
</body>
</html>
